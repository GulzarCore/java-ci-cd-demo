name: Build and Push

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gulzarcore/java-ci-cd-demo:latest
            ghcr.io/gulzarcore/java-ci-cd-demo:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Image pushed to ghcr"
          echo "Staging deployment url would be: https://your-staging-app.render.com"
          echo "Image: ghcr.io/gulzarcore/java-ci-cd-demo:latest"



      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════╗"
          echo "║   BUILD SUMMARY                    ║"
          echo "╚════════════════════════════════════╝"
          echo ""
          echo "✅ Tests: PASSED"
          echo "✅ Build: PASSED"
          echo "✅ Docker image: PUSHED"
          echo ""
          echo "📦 Image details:"
          echo "  Registry: ghcr.io"
          echo "  Repository: ${{ github.repository_owner }}/java-ci-cd-demo"
          echo "  Tags: latest, ${{ github.run_number }}"
          echo ""
          echo "🚀 Next step: Deploy to production via workflow_dispatch"
          echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
