name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to rollback to (e.g., 42, 43, latest)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Verify image exists
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}
    
    - name: Stop current production
      run: |
        echo "⏹️  Stopping current production container..."
        docker stop java-ci-cd-demo-prod 2>/dev/null || true
        docker rm java-ci-cd-demo-prod 2>/dev/null || true
    
    - name: Start rollback version
      run: |
        echo "⏮️  Rolling back to: ${{ github.event.inputs.image_tag }}"
        docker run -d \
          --name java-ci-cd-demo-prod \
          -p 9090:8080 \
          ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}
        
        sleep 5
        echo "✅ Rollback complete"
        docker logs java-ci-cd-demo-prod
    
    - name: Verify rollback
      run: |
        STATUS=$(docker inspect -f='{{.State.Running}}' java-ci-cd-demo-prod)
        if [ "$STATUS" = "true" ]; then
          echo "✅ Container is running successfully"
        else
          echo "❌ Container failed to start"
          exit 1
        fi
    
    - name: Create rollback notification
      run: |
        echo "🔔 Rollback Alert"
        echo "Version: ${{ github.event.inputs.image_tag }}"
        echo "Time: $(date)"
        echo "Actor: ${{ github.actor }}"


    - name: Deployment summary
      if: always()
      run: |
        echo ""
        echo "╔════════════════════════════════════╗"
        echo "║   DEPLOYMENT SUMMARY               ║"
        echo "╚════════════════════════════════════╝"
        echo ""
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}"
        echo "🌍 Environment: Production"
        echo "👤 Deployed by: ${{ github.actor }}"
        echo "⏰ Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "📍 Port: 9090"
        echo "✅ Status: ${{ job.status }}"
        echo ""
        echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
