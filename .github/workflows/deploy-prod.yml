name: Deploy to Production 

on:
 workflow_dispatch:
  inputs:
    image_tag:
      description: 'Docker image tag ( e.g., latest, v1.0.0)'
      required: true 
      default: 'latest'

jobs: 
  deploy:
    runs-on: ubuntu-latest  
    environment: production 

    steps:
    - name: Checkout
      uses: action/checkout@v4 

    - name: Pull image from GHCR 
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.input.image_tag}}

    - name: Deploy to production 
      id: deploy
      run: |
        echo " Deploying to Production..."
        echo "Image: ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{
        github.event.inputs.image_tag }}"

        # Stop Old Container
        docker stop java-ci-cd-demo-prod 2>/dev/null || true
        docker rm java-ci-cd-demo-prod 2>/dev/null || true

        # Start new Container 
        docker run -d \
          --name java-ci-cd-demo-prod \
          -p 9090:8080 \
          --health-cmd='curl -f http://localhost:8080/health || exit 1' \
          --health-interval=30s \
          --health-timeout=10s \
          --health-retries=3 \
          ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{
          github.event.inputs.image_tag }}

        echo "deployment_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        echo "deployment_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT

    - name: wait for health check 
      run: |
        echo " waiting for app health Check... "
        for i in {1..30}; do 
          if docker exec java-ci-cd-demo-prod curl -f http://localhost:8080 > /dev/null 2>&1; then
            echo " App is Healthy!"
            exit 0
          fi
          echo "attemp $i/30..."
          sleep 2
        done 
        echo "Health Check failed after 30 attempts"
        exit 1

    - name: Log Deloyment 
      if: always()
      run: |
        echo "=== Deployment Report ===" >>> deployment.log
        echo "Time: ${{ ste}}"


    - name: Track production deployment
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const deployment = {
            id: context.runId,
            timestamp: new Date().toISOString(),
            environment: 'production',
            imageTag: '${{ github.event.inputs.image_tag }}',
            actor: context.actor,
            status: '${{ job.status }}',
            commitSha: context.sha,
            workflowUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
          };
          
          console.log('📝 Deployment Record:');
          console.log(JSON.stringify(deployment, null, 2));
    
    - name: Create GitHub deployment
      uses: actions/github-script@v7
      with:
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.ref,
            environment: 'production',
            description: 'Deployed image: ${{ github.event.inputs.image_tag }}',
            auto_merge: false,
            required_contexts: []
          });
          
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: deployment.data.id,
            state: '${{ job.status }}',
            environment_url: 'http://localhost:9090',
            description: 'Production deployment'
          });
          
          console.log('✅ Deployment tracked in GitHub');


    - name: Deployment summary
      if: always()
      run: |
        echo ""
        echo "╔════════════════════════════════════╗"
        echo "║   DEPLOYMENT SUMMARY               ║"
        echo "╚════════════════════════════════════╝"
        echo ""
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}"
        echo "🌍 Environment: Production"
        echo "👤 Deployed by: ${{ github.actor }}"
        echo "⏰ Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        echo "📍 Port: 9090"
        echo "✅ Status: ${{ job.status }}"
        echo ""
        echo "🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo ""
