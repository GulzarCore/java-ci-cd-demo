name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Pull image from GHCR
      run: |
        docker pull ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        echo "Image: ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}"
        echo "Tag: ${{ github.event.inputs.image_tag }}"
        
        # Stop old container
        docker stop java-ci-cd-demo-prod 2>/dev/null || true
        docker rm java-ci-cd-demo-prod 2>/dev/null || true
        
        # Start new container
        docker run -d \
          --name java-ci-cd-demo-prod \
          -p 9090:8080 \
          ghcr.io/${{ github.repository_owner }}/java-ci-cd-demo:${{ github.event.inputs.image_tag }}
        
        echo "✅ Production deployment complete"
        docker logs java-ci-cd-demo-prod
    
    - name: Health check
      run: |
        echo "Waiting for app to start..."
        sleep 5
        # Simple health check (adjust if your app has a health endpoint)
        docker logs java-ci-cd-demo-prod || echo "Container check passed"
